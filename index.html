<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>心语</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="心语">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2315131A'/%3E%3Ctext x='50' y='66' font-size='52' text-anchor='middle' fill='%23E3A65A'%3E%E5%BF%83%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#15131A; --surface:#1F1C27; --surface2:#2A2635; --line:#332F40;
  --text:#EDEAF2; --text-soft:#9B96AB; --text-faint:#655F78;
  --accent:#E3A65A; --accent-soft:rgba(227,166,90,.16);
  --danger:#E37272;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,"Segoe UI",sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  overflow:hidden;
}
#app{display:flex; flex-direction:column; height:100%;}
header{
  padding:14px 18px 12px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
}
header h1{font-size:17px; margin:0; font-weight:600; letter-spacing:.02em;}
header .sub{font-size:12px; color:var(--text-soft); margin-top:2px;}
.view{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.view[hidden]{display:none;}

/* chat */
#msgs{padding:16px 14px 10px; display:flex; flex-direction:column; gap:10px;}
.msg{max-width:80%; padding:9px 13px; border-radius:16px; font-size:15px; line-height:1.5; white-space:pre-wrap;}
.msg.user{align-self:flex-end; background:var(--accent); color:#1C1408; border-bottom-right-radius:5px;}
.msg.bot{align-self:flex-start; background:var(--surface2); color:var(--text); border-bottom-left-radius:5px;}
.msg.bot.proactive{border:1px solid var(--accent); background:var(--accent-soft);}
.msg.system{align-self:center; color:var(--text-faint); font-size:12px; background:none;}
.composer{
  display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line);
  background:var(--bg); flex-shrink:0;
}
.composer textarea{
  flex:1; resize:none; background:var(--surface); border:1px solid var(--line);
  color:var(--text); border-radius:14px; padding:10px 13px; font-size:15px;
  font-family:inherit; max-height:100px;
}
.composer button{
  background:var(--accent); color:#1C1408; border:none; border-radius:14px;
  padding:0 18px; font-size:15px; font-weight:600;
}

/* diary */
#diary-list{padding:14px; display:flex; flex-direction:column; gap:10px;}
.entry{background:var(--surface); border-radius:12px; padding:12px 14px;}
.entry .ts{font-size:11px; color:var(--text-faint); margin-bottom:4px;}
.entry .txt{font-size:14px; line-height:1.55; white-space:pre-wrap;}
.diary-add{padding:12px; border-top:1px solid var(--line); display:flex; gap:8px; flex-shrink:0;}
.diary-add textarea{flex:1; background:var(--surface); border:1px solid var(--line); color:var(--text); border-radius:12px; padding:9px 12px; font-family:inherit; font-size:14px; resize:none;}
.diary-add button{background:var(--accent); color:#1C1408; border:none; border-radius:12px; padding:0 16px; font-weight:600;}

/* settings */
.settings-wrap{padding:16px 18px 40px;}
.field{margin-bottom:18px;}
.field label{display:block; font-size:12.5px; color:var(--text-soft); margin-bottom:6px;}
.field input[type=text],.field input[type=password],.field select,.field textarea{
  width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text);
  border-radius:10px; padding:9px 12px; font-size:14.5px; font-family:inherit;
}
.field textarea{resize:vertical; min-height:64px;}
.row{display:flex; gap:10px;}
.row .field{flex:1;}
.switch-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0;}
.switch-row span{font-size:14.5px;}
input[type=range]{width:100%; accent-color:var(--accent);}
.hint{font-size:11.5px; color:var(--text-faint); margin-top:4px; line-height:1.5;}
.section-title{font-size:13px; color:var(--accent); font-weight:600; margin:26px 0 4px; text-transform:none;}
.btn-row{display:flex; gap:10px; margin-top:8px;}
.btn{flex:1; text-align:center; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:13.5px;}
.btn.primary{background:var(--accent); color:#1C1408; border:none; font-weight:600;}

/* tabbar */
.tabbar{
  display:flex; border-top:1px solid var(--line); background:var(--bg); flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tabbar button{
  flex:1; padding:10px 0 8px; background:none; border:none; color:var(--text-faint);
  font-size:11.5px; display:flex; flex-direction:column; align-items:center; gap:3px;
}
.tabbar button .ic{font-size:19px;}
.tabbar button.active{color:var(--accent);}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1 id="hdr-title">心语</h1>
      <div class="sub" id="hdr-sub">未设置角色</div>
    </div>
    <div class="sub" id="hdr-status"></div>
  </header>

  <div class="view" id="view-chat"><div id="msgs"></div></div>

  <div class="view" id="view-diary" hidden>
    <div id="diary-list"></div>
  </div>

  <div class="view" id="view-settings" hidden>
    <div class="settings-wrap">
      <div class="section-title">角色设定</div>
      <div class="field"><label>角色名称</label><input type="text" id="s-char-name" placeholder="例如：小夜"></div>
      <div class="field"><label>角色设定 / 人设</label><textarea id="s-char-persona" placeholder="描述性格、说话风格、背景故事…"></textarea></div>

      <div class="section-title">API 配置</div>
      <div class="field"><label>服务商</label>
        <select id="s-provider">
          <option value="gemini">Google Gemini 官方 API</option>
          <option value="openrouter">OpenRouter</option>
        </select>
      </div>
      <div class="field"><label>API Key</label><input type="password" id="s-key" placeholder="粘贴你的 API Key"></div>
      <div class="field"><label>模型名称</label><input type="text" id="s-model" placeholder="如 gemini-2.0-flash 或 openai/gpt-4o-mini"></div>
      <div class="hint">Key 只保存在本机浏览器 localStorage 中，不会上传到任何服务器。</div>

      <div class="section-title">主动聊天</div>
      <div class="switch-row"><span>开启主动聊天</span>
        <input type="checkbox" id="s-proactive-on" style="width:20px;height:20px;accent-color:var(--accent);">
      </div>
      <div class="row">
        <div class="field"><label>最短间隔（分钟）</label><input type="text" inputmode="numeric" id="s-min" value="30"></div>
        <div class="field"><label>最长间隔（分钟）</label><input type="text" inputmode="numeric" id="s-max" value="90"></div>
      </div>
      <div class="field"><label>触发概率 <span id="s-prob-val">40%</span></label>
        <input type="range" id="s-prob" min="0" max="100" value="40">
      </div>
      <div class="hint">到时间后会先让 AI 自行判断"现在有没有自然的话想说"，不是机械发消息；没有就跳过。仅在本页面保持打开时生效，锁屏或退到后台后计时会暂停。</div>

      <div class="section-title">数据</div>
      <div class="btn-row">
        <button class="btn" id="btn-export-txt">导出 TXT</button>
        <button class="btn" id="btn-export-json">导出 JSON</button>
      </div>
      <div class="btn-row">
        <button class="btn" id="btn-import-txt">导入 TXT 聊天记录</button>
        <input type="file" id="file-import-txt" accept=".txt" style="display:none;">
      </div>
      <div class="hint">支持"说话人：内容"格式，每条消息之间空一行分隔（和这里导出的 TXT 格式一致）。说话人写"我"会算作你说的，其他名字都会算作角色说的。导入内容会追加在现有记录后面。</div>
      <div class="btn-row">
        <button class="btn" id="btn-clear-chat">清空聊天记录</button>
        <button class="btn primary" id="btn-save">保存设置</button>
      </div>
    </div>
  </div>

  <div class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
    <button id="send">发送</button>
  </div>

  <div class="diary-add" id="diary-add" style="display:none;">
    <textarea id="diary-input" rows="1" placeholder="今天想记点什么…"></textarea>
    <button id="diary-save">记录</button>
  </div>

  <nav class="tabbar">
    <button data-tab="chat" class="active"><span class="ic">💬</span>聊天</button>
    <button data-tab="diary"><span class="ic">📔</span>日记</button>
    <button data-tab="settings"><span class="ic">⚙️</span>设置</button>
  </nav>
</div>

<script>
const K = 'xinyu_v1';
const state = JSON.parse(localStorage.getItem(K) || 'null') || {
  char:{name:'', persona:''},
  cfg:{provider:'gemini', key:'', model:''},
  proactive:{on:false, min:30, max:90, prob:40},
  messages:[], diary:[]
};
function save(){ localStorage.setItem(K, JSON.stringify(state)); }

// ---- header ----
function refreshHeader(){
  document.getElementById('hdr-title').textContent = state.char.name || '心语';
  document.getElementById('hdr-sub').textContent = state.char.persona
    ? (state.char.name ? '与 '+state.char.name+' 聊天中' : '已设置人设')
    : '未设置角色 · 去设置里填一下';
}

// ---- tabs ----
const views = {chat:document.getElementById('view-chat'), diary:document.getElementById('view-diary'), settings:document.getElementById('view-settings')};
document.querySelectorAll('.tabbar button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.tabbar button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    Object.entries(views).forEach(([k,v])=> v.hidden = (k!==b.dataset.tab));
    document.getElementById('composer').style.display = b.dataset.tab==='chat' ? 'flex':'none';
    document.getElementById('diary-add').style.display = b.dataset.tab==='diary' ? 'flex':'none';
  };
});

// ---- chat render ----
const msgsEl = document.getElementById('msgs');
function renderMsgs(){
  msgsEl.innerHTML = '';
  state.messages.forEach(m=>{
    const d = document.createElement('div');
    d.className = 'msg ' + (m.role==='user'?'user':'bot') + (m.proactive?' proactive':'');
    d.textContent = m.content;
    msgsEl.appendChild(d);
  });
  msgsEl.scrollTop = msgsEl.scrollHeight;
}
function pushMsg(role, content, proactive){
  state.messages.push({role, content, ts:Date.now(), proactive:!!proactive});
  save(); renderMsgs();
}

// ---- API ----
async function callModel(history, judgeMode){
  const persona = state.char.persona || '你是一个友好的聊天伙伴。';
  const sys = judgeMode
    ? persona + '\n\n现在请你判断：结合最近的对话，你现在有没有一句很自然、不刻意的话想主动说？如果没有，只回复 NOPE 这四个字母，不要有任何其他内容。如果有，直接用角色口吻说出那句话，不要加任何解释或前缀。'
    : persona;
  if(state.cfg.provider === 'gemini'){
    const contents = history.map(m=>({role: m.role==='user'?'user':'model', parts:[{text:m.content}]}));
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(state.cfg.model)}:generateContent?key=${encodeURIComponent(state.cfg.key)}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({contents, systemInstruction:{parts:[{text:sys}]}})
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error?.message || ('Gemini 请求失败 '+res.status));
    return data.candidates?.[0]?.content?.parts?.map(p=>p.text).join('') || '';
  } else {
    const messages = [{role:'system', content:sys}, ...history.map(m=>({role:m.role==='user'?'user':'assistant', content:m.content}))];
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.cfg.key},
      body: JSON.stringify({model: state.cfg.model, messages})
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error?.message || ('OpenRouter 请求失败 '+res.status));
    return data.choices?.[0]?.message?.content || '';
  }
}

let sending = false;
async function sendCurrent(){
  const inp = document.getElementById('input');
  const text = inp.value.trim();
  if(!text || sending) return;
  if(!state.cfg.key || !state.cfg.model){ alert('请先去设置里填写 API Key 和模型名称'); return; }
  inp.value=''; inp.style.height='auto';
  pushMsg('user', text);
  sending = true;
  document.getElementById('hdr-status').textContent = '思考中…';
  try{
    const reply = await callModel(state.messages.slice(-20));
    pushMsg('assistant', reply || '（没有收到内容）');
  }catch(e){
    pushMsg('assistant', '⚠️ 出错了：' + e.message);
  }finally{
    sending = false;
    document.getElementById('hdr-status').textContent = '';
  }
}
document.getElementById('send').onclick = sendCurrent;
document.getElementById('input').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendCurrent(); }
});
document.getElementById('input').addEventListener('input', function(){
  this.style.height='auto'; this.style.height = Math.min(this.scrollHeight,100)+'px';
});

// ---- diary ----
const diaryList = document.getElementById('diary-list');
function renderDiary(){
  diaryList.innerHTML = '';
  [...state.diary].reverse().forEach(e=>{
    const el = document.createElement('div'); el.className='entry';
    const ts = document.createElement('div'); ts.className='ts'; ts.textContent = new Date(e.ts).toLocaleString('zh-CN');
    const tx = document.createElement('div'); tx.className='txt'; tx.textContent = e.text;
    el.appendChild(ts); el.appendChild(tx); diaryList.appendChild(el);
  });
}
document.getElementById('diary-save').onclick = ()=>{
  const ta = document.getElementById('diary-input');
  const t = ta.value.trim();
  if(!t) return;
  state.diary.push({ts:Date.now(), text:t});
  save(); ta.value=''; renderDiary();
};

// ---- settings ----
function fillSettings(){
  document.getElementById('s-char-name').value = state.char.name;
  document.getElementById('s-char-persona').value = state.char.persona;
  document.getElementById('s-provider').value = state.cfg.provider;
  document.getElementById('s-key').value = state.cfg.key;
  document.getElementById('s-model').value = state.cfg.model;
  document.getElementById('s-proactive-on').checked = state.proactive.on;
  document.getElementById('s-min').value = state.proactive.min;
  document.getElementById('s-max').value = state.proactive.max;
  document.getElementById('s-prob').value = state.proactive.prob;
  document.getElementById('s-prob-val').textContent = state.proactive.prob + '%';
}
document.getElementById('s-prob').addEventListener('input', function(){
  document.getElementById('s-prob-val').textContent = this.value + '%';
});
document.getElementById('btn-save').onclick = ()=>{
  state.char.name = document.getElementById('s-char-name').value.trim();
  state.char.persona = document.getElementById('s-char-persona').value.trim();
  state.cfg.provider = document.getElementById('s-provider').value;
  state.cfg.key = document.getElementById('s-key').value.trim();
  state.cfg.model = document.getElementById('s-model').value.trim();
  state.proactive.on = document.getElementById('s-proactive-on').checked;
  state.proactive.min = Math.max(1, parseInt(document.getElementById('s-min').value)||30);
  state.proactive.max = Math.max(state.proactive.min, parseInt(document.getElementById('s-max').value)||90);
  state.proactive.prob = parseInt(document.getElementById('s-prob').value);
  save(); refreshHeader();
  if(state.proactive.on && 'Notification' in window && Notification.permission==='default'){ Notification.requestPermission(); }
  scheduleProactive();
  alert('已保存');
};
document.getElementById('btn-clear-chat').onclick = ()=>{
  if(confirm('确定清空所有聊天记录？')){ state.messages=[]; save(); renderMsgs(); }
};

// ---- export ----
function download(filename, content, type){
  const blob = new Blob([content], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}
document.getElementById('btn-export-txt').onclick = ()=>{
  const txt = state.messages.map(m=> (m.role==='user'?'我':(state.char.name||'AI')) + '：' + m.content).join('\n\n');
  download('心语聊天记录_'+Date.now()+'.txt', txt, 'text/plain');
};
document.getElementById('btn-export-json').onclick = ()=>{
  download('心语数据备份_'+Date.now()+'.json', JSON.stringify(state, null, 2), 'application/json');
};

// ---- import txt ----
document.getElementById('btn-import-txt').onclick = ()=> document.getElementById('file-import-txt').click();
document.getElementById('file-import-txt').addEventListener('change', function(){
  const file = this.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const text = reader.result;
    const blocks = text.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
    let added = 0, base = Date.now();
    blocks.forEach((block, i)=>{
      const m = block.match(/^([^\n：:]{1,20})[：:]\s*([\s\S]+)$/);
      if(!m) return;
      const speaker = m[1].trim();
      const content = m[2].trim();
      if(!content) return;
      const isUser = /^(我|user|me)$/i.test(speaker);
      state.messages.push({role:isUser?'user':'assistant', content, ts:base+i, proactive:false});
      added++;
    });
    save(); renderMsgs();
    this.value = '';
    alert(added ? ('已导入 '+added+' 条消息') : '没有识别到符合格式的消息，检查一下格式是不是"说话人：内容"，消息之间要空一行');
  };
  reader.readAsText(file, 'UTF-8');
});

// ---- proactive chat ----
let proactiveTimer = null;
function scheduleProactive(){
  if(proactiveTimer){ clearTimeout(proactiveTimer); proactiveTimer=null; }
  if(!state.proactive.on) return;
  const min = state.proactive.min, max = state.proactive.max;
  const mins = min + Math.random()*(max-min);
  proactiveTimer = setTimeout(fireProactive, mins*60000);
}
async function fireProactive(){
  try{
    if(state.proactive.on && state.cfg.key && state.cfg.model && Math.random()*100 < state.proactive.prob){
      const reply = await callModel(state.messages.slice(-20), true);
      if(reply && reply.trim().toUpperCase() !== 'NOPE'){
        pushMsg('assistant', reply.trim(), true);
        if('Notification' in window && Notification.permission==='granted'){
          new Notification(state.char.name || '心语', {body: reply.trim().slice(0,80)});
        }
      }
    }
  }catch(e){ /* 静默失败，等下一轮 */ }
  scheduleProactive();
}

// ---- init ----
refreshHeader(); renderMsgs(); renderDiary(); fillSettings(); scheduleProactive();
</script>
</body>
</html>
